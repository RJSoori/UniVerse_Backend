# 1. Aiven MySQL Connection Details (Linked to .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP resilience - without this, a connection that died while this machine was asleep
# (laptop sleep/wake, wifi drop) sits in the pool until something tries to use it and fails
# with "Communications link failure". keepalive-time makes the pool proactively ping idle
# connections and replace dead ones on its own schedule, well before a real request needs one;
# max-lifetime recycles connections before they're old enough to be silently dropped server-side.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# 2. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Azure Storage Settings
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container=${AZURE_STORAGE_CONTAINER:recruiter-documents}

# 4. App Settings
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 5. Security / Auth
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:1440}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:5174}
app.admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# 6. Email (Gmail SMTP) - three separate sender identities, one per module.
# See common/email/MailConfig.java for how these are wired into JavaMailSender beans.
app.mail.jobhub.username=${MAIL_JOBHUB_USERNAME:}
app.mail.jobhub.app-password=${MAIL_JOBHUB_APP_PASSWORD:}
app.mail.jobhub.from-name=${MAIL_JOBHUB_FROM_NAME:UniVerse JobHub}

app.mail.marketplace.username=${MAIL_MARKETPLACE_USERNAME:}
app.mail.marketplace.app-password=${MAIL_MARKETPLACE_APP_PASSWORD:}
app.mail.marketplace.from-name=${MAIL_MARKETPLACE_FROM_NAME:UniVerse Marketplace}

app.mail.student.username=${MAIL_STUDENT_USERNAME:}
app.mail.student.app-password=${MAIL_STUDENT_APP_PASSWORD:}
app.mail.student.from-name=${MAIL_STUDENT_FROM_NAME:UniVerse}

# 8. Gemini (Google AI) - CV skill extraction for Job Hub's SkillsManager
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
