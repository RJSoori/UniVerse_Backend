# Development Mode - In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# App Settings
server.port=8080

# Security / Auth
app.jwt.secret=ThisIsADevelopmentJwtSecretKeyThatIsDefinitelyLongerThan32BytesForTesting123456789
app.jwt.ttl-minutes=1440
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
app.admin.bootstrap.username=admin
app.admin.bootstrap.password=admin123

